services:

  frontend:
    build: ./frontend
    ports: ['3000:80']
    environment:
      - VITE_SIGNAL_URL=http://localhost:4000
    depends_on:
      signaling-server:
        condition: service_healthy
      analysis-api:
        condition: service_healthy

  signaling-server:
    build: ./signaling-server
    ports: ['4000:4000']
    environment:
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=${REDIS_URL}
      - SIGNAL_REDIS_DB=2
      - ALLOWED_ORIGIN=http://localhost:3000
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  analysis-api:
    build: ./analysis-api
    ports: ['8000:8000']
    environment:
      - MONGO_URI=${MONGO_URI}
      - TIMESCALE_URL=${TIMESCALE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER=${CELERY_BROKER}
      - SIGNAL_REDIS_DB=2
    volumes: ['./analysis-api/models:/app/models']
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
