services:
  frontend:
    build: ./frontend
    ports: ['3000:80']
    environment:
      - VITE_SIGNAL_URL=http://localhost:4000
      - VITE_ANALYSIS_URL=http://localhost:8000
    depends_on:
      - signaling-server
      - analysis-api

  signaling-server:
    build: ./signaling-server
    ports: ['4000:4000']
    environment:
      - APP_DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@nexus-timescale:5432/${DB_NAME}?schema=public
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@nexus-timescale:5432/${DB_NAME}?schema=public
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET required}
      - REDIS_URL=redis://redis:6379/0
      - SIGNAL_REDIS_DB=2
      - ALLOWED_ORIGIN=http://localhost:3000
      - NODE_ENV=production
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?LIVEKIT_API_KEY required}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET required}
      - LIVEKIT_WS_URL=ws://localhost:7880
      - VITE_ANALYSIS_URL=http://analysis-api:8000
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN required}
    depends_on:
      - redis

  analysis-api:
    build: ./analysis-api
    ports: ['8000:8000']
    environment:
      - APP_DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@nexus-timescale:5432/${DB_NAME}?schema=public
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@nexus-timescale:5432/${DB_NAME}?schema=public
      - TELEMETRY_DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@nexus-timescale:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_ORIGIN=http://localhost:3000,http://localhost:5173
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET required}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?LIVEKIT_API_KEY required}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET required}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN required}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    volumes: 
      - './analysis-api/models:/app/models'


  nexus-timescale:
    image: timescale/timescaledb:latest-pg15
    container_name: nexus-timescale
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=nexus
    ports:
      - '5432:5432'
    volumes:
      - pgdata_telemetry:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexus"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5



  livekit:
    image: livekit/livekit-server:latest
    command: --config /livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50050:50000-50050/udp"
    volumes:
      - ./livekit.yaml:/livekit.yaml
    environment:
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY:?LIVEKIT_API_KEY required}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET required}"

volumes:
  pgdata_telemetry:
  pgdata_app:

