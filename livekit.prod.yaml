# Nexus Production LiveKit Server Configuration
# Reference: https://docs.livekit.io/home/self-hosting/deployment/

port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50050
  use_external_ip: true
  stun_servers:
    - stun.l.google.com:19302
    - stun1.l.google.com:19302

# Optional TURN configuration if behind strict symmetric NAT / enterprise firewalls
# turn:
#   enabled: true
#   domain: turn.yourdomain.com
#   cert_file: /etc/livekit/turn.crt
#   key_file: /etc/livekit/turn.key
#   udp_port: 3478

# Webhook routed directly to internal analysis-api service on nexus-internal network
webhook:
  urls:
    - http://analysis-api:8000/api/webhooks/livekit

# Logging
logging:
  level: info
  pion_level: warn
